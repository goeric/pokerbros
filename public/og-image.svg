<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#047857;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#065f46;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>

  <!-- Poker table felt pattern -->
  <ellipse cx="600" cy="315" rx="450" ry="250" fill="#059669" opacity="0.5"/>

  <!-- Poker chips scattered in background -->
  <g opacity="0.15">
    <circle cx="150" cy="120" r="40" fill="#FBBF24"/>
    <circle cx="1050" cy="500" r="45" fill="#EF4444"/>
    <circle cx="200" cy="480" r="35" fill="#3B82F6"/>
    <circle cx="980" cy="150" r="38" fill="#FBBF24"/>
  </g>

  <!-- Main content card -->
  <rect x="150" y="140" width="900" height="350" rx="20" fill="#1F2937" stroke="#FBBF24" stroke-width="3"/>
  <rect x="150" y="140" width="900" height="350" rx="20" fill="url(#card-shine)"/>

  <!-- Logo/Icon - Poker chip -->
  <g transform="translate(220, 240)">
    <circle cx="0" cy="0" r="70" fill="#059669" stroke="#FBBF24" stroke-width="5"/>
    <circle cx="0" cy="0" r="50" fill="#047857" stroke="#FBBF24" stroke-width="2"/>
    <!-- Spade -->
    <g fill="#FBBF24">
      <path d="M0 -25 C-10 -15, -10 -5, 0 5 C10 -5, 10 -15, 0 -25 Z"/>
      <path d="M-6 2 L0 9 L6 2 L4 2 L4 9 L-4 9 L-4 2 Z"/>
    </g>
    <!-- Chip segments -->
    <g fill="#FBBF24">
      <rect x="-3" y="-72" width="6" height="12" rx="2"/>
      <rect x="-3" y="60" width="6" height="12" rx="2"/>
      <rect x="-72" y="-3" width="12" height="6" rx="2"/>
      <rect x="60" y="-3" width="12" height="6" rx="2"/>
    </g>
  </g>

  <!-- Title -->
  <text x="400" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF">
    PokerBros
  </text>

  <!-- Tagline -->
  <text x="400" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="400" fill="#FBBF24">
    Never Miss a Full Table
  </text>

  <!-- Subtitle -->
  <text x="400" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="300" fill="#D1D5DB">
    Manage your home poker games with
  </text>
  <text x="400" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="300" fill="#D1D5DB">
    real-time tracking and player statistics
  </text>

  <!-- Decorative cards -->
  <g transform="translate(880, 300)">
    <!-- Card 1 - Ace of Spades -->
    <rect x="0" y="-20" width="60" height="90" rx="5" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
    <text x="10" y="10" font-family="serif" font-size="24" font-weight="bold" fill="#000000">A</text>
    <text x="10" y="30" font-family="serif" font-size="20" fill="#000000">♠</text>
  </g>

  <g transform="translate(960, 295)">
    <!-- Card 2 - King of Hearts -->
    <rect x="0" y="-20" width="60" height="90" rx="5" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
    <text x="10" y="10" font-family="serif" font-size="24" font-weight="bold" fill="#EF4444">K</text>
    <text x="10" y="30" font-family="serif" font-size="20" fill="#EF4444">♥</text>
  </g>
</svg>
