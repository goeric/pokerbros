<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;display=swap');
        </style>
        <!-- Background Gradient -->
        <linearGradient id="bgGradient" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#020906"/>
            <stop offset="0.5" stop-color="#0f392b"/>
            <stop offset="1" stop-color="#020906"/>
        </linearGradient>

        <!-- Logo Gradients (Ported from source) -->
        <linearGradient id="chipBody" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#D92828"/>
            <stop offset="0.5" stop-color="#8B0000"/>
            <stop offset="1" stop-color="#500000"/>
        </linearGradient>
        <linearGradient id="goldFoil" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#F3E5AB"/>
            <stop offset="0.3" stop-color="#D4AF37"/>
            <stop offset="0.6" stop-color="#8B7325"/>
            <stop offset="1" stop-color="#F3E5AB"/>
        </linearGradient>
        
        <!-- Drop Shadow for depth -->
        <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
            <feOffset dx="0" dy="10" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.5"/>
            </feComponentTransfer>
            <feMerge> 
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/> 
            </feMerge>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="1200" height="630" fill="url(#bgGradient)"/>

    <!-- Content Group: Centered manually -->
    <!-- We position the logo and text to look balanced in the 1200px width -->
    
    <!-- Logo Mark Group -->
    <!-- Original viewBox was 0-100. We scale it by 3.5x to be 350px wide -->
    <!-- Positioned left-center -->
    <g transform="translate(280, 165) scale(3)">
        <g>
            <!-- Main Chip -->
            <circle cx="50" cy="50" r="48" fill="url(#chipBody)"/>
            <circle cx="50" cy="50" r="47" stroke="url(#goldFoil)" stroke-width="1" opacity="0.6"/>
            <!-- Casino Edge Spots -->
            <circle cx="50" cy="50" r="43" stroke="white" stroke-width="10" stroke-dasharray="12 24" opacity="0.9"/>
            <!-- Inner Ring -->
            <circle cx="50" cy="50" r="34" stroke="url(#goldFoil)" stroke-width="1.5" stroke-dasharray="1 1"/>
            <!-- Inlay -->
            <circle cx="50" cy="50" r="28" fill="#111111" stroke="url(#goldFoil)" stroke-width="0.5"/>
            <!-- Spade -->
            <g transform="translate(50 48) scale(0.8)">
                <path d="M0 -12C3 -16 9 -16 12 -12C16 -8 12 4 0 10C-12 4 -16 -8 -12 -12C-9 -16 -3 -16 0 -12Z" fill="url(#goldFoil)"/>
                <path d="M0 10V18" stroke="url(#goldFoil)" stroke-width="3" stroke-linecap="round"/>
                <path d="M-5 18H5" stroke="url(#goldFoil)" stroke-width="2" stroke-linecap="round"/>
            </g>
            <!-- Reflection -->
            <ellipse cx="50" cy="25" rx="20" ry="10" fill="white" opacity="0.1"/>
        </g>
    </g>

    <!-- Typography -->
    <!-- Positioned to the right of the logo -->
    <text x="600" y="350" 
          font-family="'Space Grotesk', sans-serif" 
          font-weight="bold" 
          font-size="110" 
          fill="white" 
          letter-spacing="0.02em">
        POKER<tspan fill="#D4AF37">BROS</tspan>
    </text>
    
    <!-- Tagline / Subtext (Optional visual balance) -->
    <text x="605" y="400" 
          font-family="'Space Grotesk', sans-serif" 
          font-weight="500" 
          font-size="24" 
          fill="#rgba(255,255,255,0.6)" 
          letter-spacing="0.1em">
        EST. 2025
    </text>

</svg>